# Configuration for `dart run flutter_native_splash:create`.
#
# Run from the repository root:
#   flutter pub get
#   dart run flutter_native_splash:create
#
# Platform scope:
#   Only the Web target is enabled. The repository does not (yet) contain
#   android/ or ios/ directories. When a native platform is added later,
#   flip its flag to `true` and re-run the tool locally to commit the
#   generated binary assets.

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/images/logo.png
  image_dark: assets/images/logo.png

  android: false
  ios: false
  web: true

  fullscreen: true
