# Configuration for `dart run flutter_native_splash:create`.
# Run from the repository root:
#   flutter pub get
#   dart run flutter_native_splash:create

flutter_native_splash:
  # لون الخلفية (اختر اللون الذي تريده للشاشة، مثلاً الأبيض)
  color: "#FFFFFF"
  
  # لون الخلفية في الوضع الداكن (يفضل أن يكون داكناً إذا كانت الصورة شفافة)
  color_dark: "#121212"

  # 👇 هنا نضع مسار الصورة الجديدة بدلاً من اللوجو
  image: assets/images/splash_image.png
  image_dark: assets/images/splash_image.png

  # تفعيل المنصات
  web: true
  android: true
  ios: false

  # ملء الشاشة
  fullscreen: true

  # إعدادات Android 12+ (شاشة البداية الجديدة في أندرويد)
  android_12:
    # في أندرويد 12، الصورة تكون داخل دائرة، لذا تأكد أن الصورة مناسبة
    image: assets/images/splash_image.png
    # لون خلفية الدائرة
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/splash_image.png
    icon_background_color_dark: "#121212"
