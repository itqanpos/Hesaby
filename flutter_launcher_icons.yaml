# Configuration for `dart run flutter_launcher_icons`.
#
# Run from the repository root:
#   flutter pub get
#   dart run flutter_launcher_icons
#
# Platform scope:
#   Only the Web target is enabled. The repository does not (yet) contain
#   android/ or ios/ directories, so enabling those targets would fail with
#   "PathNotFoundException: AndroidManifest.xml". When a native platform is
#   added later, flip its flag to `true` and re-run the tool locally to
#   commit the generated binary assets.

flutter_launcher_icons:
  android: false
  ios: false

  # Web favicons (32, 192, 512) and apple-touch-icon (180).
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#0A4F8C"
