name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows runner if missing
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --project-name hesabi .
          fi

      - name: Patch CMakeLists for pdfium version
        shell: bash
        run: |
          set -e
          if [ ! -f windows/CMakeLists.txt ]; then
            echo "ERROR: windows/CMakeLists.txt not found after runner creation." >&2
            exit 1
          fi
          if grep -q 'set(PDFIUM_VERSION' windows/CMakeLists.txt; then
            echo "PDFIUM_VERSION already pinned — skipping."
          else
            {
              echo 'set(PDFIUM_VERSION "4634" CACHE STRING "")'
              cat windows/CMakeLists.txt
            } > windows/CMakeLists.txt.new
            mv windows/CMakeLists.txt.new windows/CMakeLists.txt
            echo "Injected PDFIUM_VERSION=4634 into windows/CMakeLists.txt"
          fi
          head -n 5 windows/CMakeLists.txt

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
