# ============================================================================
# HESABI — Build Android APK
# ============================================================================
# Builds a release-signed Android APK entirely in CI, using a dedicated
# upload keystore stored in GitHub Secrets.
#
# Required repository secrets:
#   - KEYSTORE_BASE64    : base64-encoded contents of upload-keystore.jks
#   - KEYSTORE_PASSWORD  : password for the keystore
#   - KEY_ALIAS          : key alias inside the keystore (e.g. "hesaby")
#   - KEY_PASSWORD       : password for the key (usually same as keystore)
#   - SUPABASE_URL       : Supabase project URL
#   - SUPABASE_ANON_KEY  : Supabase anon key
#
# This project is Flutter/Dart only. Do NOT add Node.js, npm, or caches.
# ============================================================================

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --reporter expanded

      - name: Generate android/ folder
        run: |
          flutter create \
            --platforms=android \
            --org com.itqanpos \
            --project-name hesabi \
            --description "Hesabi - Multi-Tenant SaaS for POS, Inventory, Sales & Accounting" \
            .

      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Set Arabic app label
        run: |
          sed -i 's/android:label="hesabi"/android:label="حسابي"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Set minSdkVersion 23 / compileSdkVersion 36 / targetSdkVersion 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' "$f" || true
              sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = 21/minSdk = 23/' "$f" || true

              sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$f" || true
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$f" || true

              sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 36/' "$f" || true

              echo "--- $f (sdk section) ---"
              grep -n 'minSdk\|compileSdk\|targetSdk' "$f" || true
            fi
          done

      - name: Patch compileSdk for ALL plugins in pub cache (dynamic)
        run: |
          set -e

          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          if [ ! -d "$PUB_CACHE_ROOT" ]; then
            echo "!! pub-cache root not found at $PUB_CACHE_ROOT"
            exit 1
          fi

          python3 - "$PUB_CACHE_ROOT" <<'PY'
          import re, pathlib, sys

          root = pathlib.Path(sys.argv[1])
          total = 0
          patched = 0

          for pkg in sorted(root.iterdir()):
              if not pkg.is_dir():
                  continue
              android_dir = pkg / 'android'
              if not android_dir.is_dir():
                  continue

              for fname in ('build.gradle', 'build.gradle.kts'):
                  f = android_dir / fname
                  if not f.exists():
                      continue
                  total += 1
                  text = f.read_text()
                  original = text

                  text = re.sub(r'compileSdkVersion\s*=?\s*[0-9]+',
                                'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdkVersion\(\s*[0-9]+\s*\)',
                                'compileSdkVersion(36)', text)
                  text = re.sub(r'compileSdk\s*=\s*[0-9]+',
                                'compileSdk = 36', text)
                  text = re.sub(r'compileSdk\(\s*[0-9]+\s*\)',
                                'compileSdk(36)', text)
                  text = re.sub(r'\bcompileSdk\s+[0-9]+\b',
                                'compileSdk 36', text)

                  if text != original:
                      f.write_text(text)
                      patched += 1
                      print(f"PATCHED: {f}")
                      for line in text.splitlines():
                          if 'compileSdk' in line:
                              print(f"   {line.strip()}")

          print('---')
          print(f'Android build files scanned: {total}')
          print(f'Android build files patched: {patched}')
          PY

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_SCAN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_ADMIN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi
          echo "--- AndroidManifest.xml (permissions section) ---"
          grep 'uses-permission\|uses-feature' "$MANIFEST"

      - name: Prepare flutter_launcher_icons.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('flutter_launcher_icons.yaml')
          text = p.read_text()

          header_block = text.split('web:', 1)[0]
          if 'image_path:' not in header_block:
              text = text.replace(
                  'flutter_launcher_icons:\n',
                  'flutter_launcher_icons:\n  image_path: "assets/images/logo.png"\n',
                  1,
              )

          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)

          p.write_text(text)
          print('--- flutter_launcher_icons.yaml (after patch) ---')
          print(text)
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare flutter_native_splash.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('flutter_native_splash.yaml')
          text = p.read_text()

          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)

          if 'android_12:' not in text:
              text += (
                  '\n  android_12:\n'
                  '    image: assets/images/logo.png\n'
                  '    color: "#FFFFFF"\n'
                  '    color_dark: "#121212"\n'
                  '    icon_background_color: "#FFFFFF"\n'
                  '    icon_background_color_dark: "#121212"\n'
              )

          p.write_text(text)
          print('--- flutter_native_splash.yaml (after patch) ---')
          print(text)
          PY

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "!! KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "Base64 length: ${#KEYSTORE_BASE64}"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks || true
          echo "First 4 bytes (hex):"
          head -c 4 android/app/upload-keystore.jks | xxd || true

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "!! Missing one of KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "--- key.properties (values hidden) ---"
          sed 's/=.*/=<redacted>/' android/key.properties

      - name: Patch build.gradle for release signing
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          GROOVY_LOADER = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """

          GROOVY_SIGNING = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """

          KOTLIN_IMPORTS = "import java.util.Properties\nimport java.io.FileInputStream\n\n"

          KOTLIN_LOADER = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """

          KOTLIN_SIGNING = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """

          def patch_groovy(text: str) -> str:
              if 'keystoreProperties' in text:
                  print('Groovy: already patched - skipping loader insert')
              else:
                  new_text, n = re.subn(
                      r'\nandroid\s*\{',
                      '\n' + GROOVY_LOADER + '\nandroid {',
                      text,
                      count=1,
                  )
                  if n == 0:
                      print('Groovy: FAILED to find "android {" - aborting')
                      sys.exit(1)
                  text = new_text

              if 'signingConfigs {' in text and 'release {' in text:
                  print('Groovy: signingConfigs.release already present')
              else:
                  text, n = re.subn(
                      r'(android\s*\{)',
                      r'\1\n' + GROOVY_SIGNING,
                      text,
                      count=1,
                  )
                  if n == 0:
                      print('Groovy: FAILED to insert signingConfigs - aborting')
                      sys.exit(1)

              text = text.replace(
                  'signingConfig = signingConfigs.debug',
                  'signingConfig = signingConfigs.release',
              )
              text = text.replace(
                  'signingConfig signingConfigs.debug',
                  'signingConfig signingConfigs.release',
              )
              return text

          def patch_kotlin(text: str) -> str:
              if 'import java.util.Properties' not in text:
                  text = KOTLIN_IMPORTS + text
                  print('Kotlin: added imports at top of file')
              else:
                  print('Kotlin: imports already present')

              if 'val keystoreProperties' in text:
                  print('Kotlin: keystoreProperties already present')
              else:
                  new_text, n = re.subn(
                      r'\nandroid\s*\{',
                      '\n' + KOTLIN_LOADER + '\nandroid {',
                      text,
                      count=1,
                  )
                  if n == 0:
                      print('Kotlin: FAILED to find "android {" - aborting')
                      sys.exit(1)
                  text = new_text
                  print('Kotlin: inserted keystoreProperties loader')

              if 'create("release")' in text:
                  print('Kotlin: signingConfigs.release already present')
              else:
                  text, n = re.subn(
                      r'(android\s*\{)',
                      r'\1\n' + KOTLIN_SIGNING,
                      text,
                      count=1,
                  )
                  if n == 0:
                      print('Kotlin: FAILED to insert signingConfigs - aborting')
                      sys.exit(1)
                  print('Kotlin: inserted signingConfigs.release')

              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              return text

          any_found = False
          for f in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              p = pathlib.Path(f)
              if not p.exists():
                  print(f'Skip: {f} does not exist')
                  continue
              any_found = True
              original = p.read_text()
              if p.suffix == '.kts':
                  patched = patch_kotlin(original)
              else:
                  patched = patch_groovy(original)
              p.write_text(patched)
              print(f'================= {f} (after patch) =================')
              print(patched)
              print('======================================================')

          if not any_found:
              print('ERROR: no android/app/build.gradle(.kts) found - aborting')
              sys.exit(1)
          PY

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # --target-platform: covers BOTH modern ARM64 devices AND older
          # ARMv7 (32-bit) devices. Removing android-arm drops support for
          # 32-bit phones, which causes an immediate crash at launch on
          # those devices. Do NOT remove it without a good reason.
          flutter build apk --$BUILD_TYPE \
            --target-platform=android-arm64,android-arm \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK signature
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          APK="build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk"
          echo "--- APK info ---"
          ls -lh "$APK"
          echo "--- Signature ---"
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || true
          else
            echo "apksigner not found - skipping signature dump"
          fi

      - name: Collect APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          mkdir -p build/apk
          cp "build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk" \
             "build/apk/hesabi-${BUILD_TYPE}-build${{ github.run_number }}.apk"
          ls -lh build/apk/

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-apk-build${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Hesabi APK - Latest"
          body: |
            **Build #${{ github.run_number }}**
            - Commit: `${{ github.sha }}`
            - Build type: `${{ github.event.inputs.build_type || 'release' }}`
            - Built from: `${{ github.ref_name }}`
            - Signed with: release keystore (stable signature)
            - Target: Android ARM64 + ARMv7 (all phones from ~2010 onwards)

            حمّل ملف APK من قسم Assets أدناه، ثم افتحه على جهاز Android
            لتثبيت Hesabi.
          files: build/apk/*.apk
          make_latest: true
          draft: false
          prerelease: true
