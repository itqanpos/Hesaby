# ============================================================================
# HESABI — Build Android APK
# ============================================================================
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$FULL_VERSION" | cut -d'+' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Detected version: $VERSION_NAME+$VERSION_CODE"

      - name: Run unit tests
        run: flutter test --reporter expanded

      - name: Generate android/ folder
        run: |
          flutter create \
            --platforms=android \
            --org com.itqanpos \
            --project-name hesabi \
            --description "Hesabi - Multi-Tenant SaaS for POS, Inventory, Sales & Accounting" \
            .

      - name: Re-install dependencies after android generation
        run: flutter pub get

      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Set Arabic app label
        run: |
          sed -i 's/android:label="hesabi"/android:label="حسابي"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Set minSdkVersion 23 / compileSdkVersion 36 / targetSdkVersion 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' "$f" || true
              sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = 21/minSdk = 23/' "$f" || true

              sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$f" || true
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$f" || true

              sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 36/' "$f" || true

              echo "--- $f (sdk section) ---"
              grep -n 'minSdk\|compileSdk\|targetSdk' "$f" || true
            fi
          done

      - name: Patch compileSdk for ALL plugins in pub cache (dynamic)
        run: |
          set -e
          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          if [ ! -d "$PUB_CACHE_ROOT" ]; then
            echo "!! pub-cache root not found at $PUB_CACHE_ROOT"
            exit 1
          fi

          python3 - "$PUB_CACHE_ROOT" <<'PY'
          import re, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          total = 0
          patched = 0
          for pkg in sorted(root.iterdir()):
              if not pkg.is_dir(): continue
              android_dir = pkg / 'android'
              if not android_dir.is_dir(): continue
              for fname in ('build.gradle', 'build.gradle.kts'):
                  f = android_dir / fname
                  if not f.exists(): continue
                  total += 1
                  text = f.read_text()
                  original = text
                  text = re.sub(r'compileSdkVersion\s*=?\s*[0-9]+', 'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdkVersion\(\s*[0-9]+\s*\)', 'compileSdkVersion(36)', text)
                  text = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 36', text)
                  text = re.sub(r'compileSdk\(\s*[0-9]+\s*\)', 'compileSdk(36)', text)
                  text = re.sub(r'\bcompileSdk\s+[0-9]+\b', 'compileSdk 36', text)
                  if text != original:
                      f.write_text(text)
                      patched += 1
                      print(f"PATCHED: {f}")
          print('---')
          print(f'Android build files scanned: {total}')
          print(f'Android build files patched: {patched}')
          PY

      - name: Add Android permissions and Disable Impeller
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          
          # إضافة الأذونات
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_SCAN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_ADMIN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi
          
          # تعطيل Impeller لحل مشكلة الكاميرا
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          if 'EnableImpeller' not in text:
              text = text.replace('<application', '<application\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />')
              p.write_text(text)
              print("Injected EnableImpeller = false")
          else:
              print("EnableImpeller already present")
          PY
          
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      - name: Prepare flutter_launcher_icons.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('flutter_launcher_icons.yaml')
          text = p.read_text()
          header_block = text.split('web:', 1)[0]
          if 'image_path:' not in header_block:
              text = text.replace('flutter_launcher_icons:\n', 'flutter_launcher_icons:\n  image_path: "assets/images/logo.png"\n', 1)
          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)
          p.write_text(text)
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare flutter_native_splash.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('flutter_native_splash.yaml')
          text = p.read_text()
          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)
          if 'android_12:' not in text:
              text += (
                  '\n  android_12:\n'
                  '    image: assets/images/logo.png\n'
                  '    color: "#FFFFFF"\n'
                  '    color_dark: "#121212"\n'
                  '    icon_background_color: "#FFFFFF"\n'
                  '    icon_background_color_dark: "#121212"\n'
              )
          p.write_text(text)
          PY

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Patch build.gradle for release signing
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          GROOVY_LOADER = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
          GROOVY_SIGNING = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """
          KOTLIN_IMPORTS = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
          KOTLIN_LOADER = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
          KOTLIN_SIGNING = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
          def patch_groovy(text: str) -> str:
              if 'keystoreProperties' not in text:
                  text, n = re.subn(r'\nandroid\s*\{', '\n' + GROOVY_LOADER + '\nandroid {', text, count=1)
              if 'signingConfigs {' not in text:
                  text, n = re.subn(r'(android\s*\{)', r'\1\n' + GROOVY_SIGNING, text, count=1)
              text = text.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              text = text.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              return text
          def patch_kotlin(text: str) -> str:
              if 'import java.util.Properties' not in text:
                  text = KOTLIN_IMPORTS + text
              if 'val keystoreProperties' not in text:
                  text, n = re.subn(r'\nandroid\s*\{', '\n' + KOTLIN_LOADER + '\nandroid {', text, count=1)
              if 'create("release")' not in text:
                  text, n = re.subn(r'(android\s*\{)', r'\1\n' + KOTLIN_SIGNING, text, count=1)
              text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              return text
          for f in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              p = pathlib.Path(f)
              if not p.exists(): continue
              original = p.read_text()
              patched = patch_kotlin(original) if p.suffix == '.kts' else patch_groovy(original)
              p.write_text(patched)
          PY

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --$BUILD_TYPE \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }} \
            --target-platform=android-arm64,android-arm \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Collect APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          mkdir -p build/apk
          APK_NAME="hesabi-v${{ env.VERSION_NAME }}-build${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk" "build/apk/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Hesabi APK - Latest (v${{ env.VERSION_NAME }})"
          body: |
            **Version:** v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})
            **Build #${{ github.run_number }}**
            - Commit: `${{ github.sha }}`
            - Built from: `${{ github.ref_name }}`
            - Signed with: release keystore (stable signature)
            - Target: Android ARM64 + ARMv7
          files: build/apk/*.apk
          make_latest: true
          draft: false
          prerelease: true
