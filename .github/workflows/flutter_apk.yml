# ============================================================================
# HESABI — Build Android APK
# ============================================================================
# Builds a signed-with-debug-key Android APK entirely in CI, without
# requiring an `android/` folder in the repository.
#
# This project is Flutter/Dart only. Do NOT add Node.js, npm, or their caches.
# ============================================================================

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate android/ folder
        run: |
          flutter create \
            --platforms=android \
            --org com.itqanpos \
            --project-name hesabi \
            --description "Hesabi - Multi-Tenant SaaS for POS, Inventory, Sales & Accounting" \
            .

      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Set Arabic app label
        run: |
          sed -i 's/android:label="hesabi"/android:label="حسابي"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Set minSdkVersion 23 / compileSdkVersion 36 / targetSdkVersion 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' "$f" || true
              sed -i 's/minSdkVersion 21/minSdkVersion 23/' "$f" || true
              sed -i 's/minSdk = 21/minSdk = 23/' "$f" || true

              sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$f" || true
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$f" || true
              sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$f" || true

              sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 36/' "$f" || true

              echo "--- $f (sdk section) ---"
              grep -n 'minSdk\|compileSdk\|targetSdk' "$f" || true
            fi
          done

      - name: Patch all plugins' compileSdk in pub cache
        run: |
          # Several third-party plugins ship with a hard-coded
          # `compileSdkVersion` that is lower than what their own
          # dependencies now require (androidx 1.13+, androidx.window,
          # androidx.fragment 1.7+, etc.). Every such plugin has to be
          # brought up to 36 before Gradle's AAR metadata check passes.
          #
          # This step walks through the known offenders inside the pub-cache
          # and rewrites their Android build files. It runs entirely inside
          # the CI runner; the repository itself is untouched.
          set -e

          PLUGINS="
          flutter_pos_printer_platform_image_3
          network_info_plus
          shared_preferences_android
          url_launcher_android
          app_links
          jni
          jni_flutter
          mobile_scanner
          "

          PLUGIN_ROOT="$HOME/.pub-cache/hosted/pub.dev"
          if [ ! -d "$PLUGIN_ROOT" ]; then
            echo "!! pub-cache root not found at $PLUGIN_ROOT"
            exit 1
          fi

          PATCHED_COUNT=0

          for NAME in $PLUGINS; do
            DIR=$(find "$PLUGIN_ROOT" -maxdepth 1 -type d -name "${NAME}-*" | head -1)
            if [ -z "$DIR" ]; then
              echo "-- ${NAME}: not present in pub-cache (skipping)"
              continue
            fi
            echo "== ${NAME}: $DIR"

            PATCHED_THIS=$(
              python3 - "$DIR" <<'PY'
          import re, pathlib, sys

          plugin_dir = sys.argv[1]
          patched_any = False

          for name in ['build.gradle', 'build.gradle.kts']:
              f = pathlib.Path(plugin_dir) / 'android' / name
              if not f.exists():
                  continue
              text = f.read_text()
              original = text

              # Groovy DSL
              text = re.sub(r'compileSdkVersion\s*=?\s*[0-9]+',
                            'compileSdkVersion 36', text)
              text = re.sub(r'compileSdkVersion\(\s*[0-9]+\s*\)',
                            'compileSdkVersion(36)', text)
              # Kotlin DSL
              text = re.sub(r'compileSdk\s*=\s*[0-9]+',
                            'compileSdk = 36', text)
              text = re.sub(r'compileSdk\(\s*[0-9]+\s*\)',
                            'compileSdk(36)', text)
              text = re.sub(r'\bcompileSdk\s+[0-9]+\b',
                            'compileSdk 36', text)

              if text != original:
                  f.write_text(text)
                  patched_any = True
                  print(f"   patched: {f}")
                  for line in text.splitlines():
                      if 'compileSdk' in line:
                          print(f"     {line.strip()}")

          sys.exit(0 if patched_any else 2)
          PY
            ) && PATCHED_COUNT=$((PATCHED_COUNT + 1)) || {
              RC=$?
              if [ $RC -eq 2 ]; then
                echo "   (no compileSdk declaration found — plugin may use the shared Flutter default)"
              else
                echo "   !! patch failed with exit code $RC"
              fi
            }
            echo "$PATCHED_THIS"
          done

          echo "---"
          echo "Total plugins patched: $PATCHED_COUNT"

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_SCAN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.BLUETOOTH_ADMIN' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi
          echo "--- AndroidManifest.xml (permissions section) ---"
          grep 'uses-permission\|uses-feature' "$MANIFEST"

      - name: Prepare flutter_launcher_icons.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('flutter_launcher_icons.yaml')
          text = p.read_text()

          header_block = text.split('web:', 1)[0]
          if 'image_path:' not in header_block:
              text = text.replace(
                  'flutter_launcher_icons:\n',
                  'flutter_launcher_icons:\n  image_path: "assets/images/logo.png"\n',
                  1,
              )

          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)

          p.write_text(text)
          print('--- flutter_launcher_icons.yaml (after patch) ---')
          print(text)
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare flutter_native_splash.yaml for Android
        run: |
          python3 - <<'PY'
          import re, pathlib

          p = pathlib.Path('flutter_native_splash.yaml')
          text = p.read_text()

          text = re.sub(r'^  android: false', '  android: true', text, flags=re.M)

          if 'android_12:' not in text:
              text += (
                  '\n  android_12:\n'
                  '    image: assets/images/logo.png\n'
                  '    color: "#FFFFFF"\n'
                  '    color_dark: "#121212"\n'
                  '    icon_background_color: "#FFFFFF"\n'
                  '    icon_background_color_dark: "#121212"\n'
              )

          p.write_text(text)
          print('--- flutter_native_splash.yaml (after patch) ---')
          print(text)
          PY

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Patch release signing to reuse debug keystore
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/signingConfig signingConfigs\.release/signingConfig signingConfigs.debug/g' "$f" || true
              sed -i 's/signingConfig = signingConfigs\.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' "$f" || true
            fi
          done

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --$BUILD_TYPE \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Collect APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          mkdir -p build/apk
          cp "build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk" \
             "build/apk/hesabi-${BUILD_TYPE}-build${{ github.run_number }}.apk"
          ls -lh build/apk/

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabi-apk-build${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Hesabi APK — Latest"
          body: |
            **Build #${{ github.run_number }}**
            - Commit: `${{ github.sha }}`
            - Build type: `${{ github.event.inputs.build_type || 'release' }}`
            - Built from: `${{ github.ref_name }}`

            حمّل ملف APK من قسم Assets أدناه، ثم افتحه على جهاز Android
            لتثبيت Hesabi.
          files: build/apk/*.apk
          make_latest: true
          draft: false
          prerelease: true
