# ============================================================================
# HESABI — Continuous Integration
# ----------------------------------------------------------------------------
# Verifies every change pushed to `main` / `develop` and every pull request
# targeting those branches. Runs on Flutter stable.
#
# This project is Flutter/Dart only. It does NOT use Node.js or npm.
# Do not add `actions/setup-node`, `npm ci`, `yarn`, or npm caching here.
# Adding npm caching without a package-lock.json causes the CI to fail with
# "Dependencies lock file is not found".
#
# Security model:
#   * Secrets (SUPABASE_URL, SUPABASE_ANON_KEY) are only referenced by the
#     web build step, which runs on trusted pushes and manual dispatches.
#   * Pull requests never depend on secrets, so forked PRs are never blocked
#     by missing credentials.
#   * Only the public anon / publishable Supabase key may ever be supplied.
#     A service-role key must never reach the Flutter client.
#
# Formatting policy:
#   The `Verify Dart formatting` step is INFORMATIONAL. It reports which files
#   would change under `dart format`, but it does not fail the job. This lets
#   analyze/test reveal real issues while the codebase is progressively being
#   formatted. Once the whole repository is formatted, remove
#   `continue-on-error: true` and re-add `--set-exit-if-changed` to make the
#   check strict again.
# ============================================================================

name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions: only reading repository contents.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    # Pinned LTS runner instead of ubuntu-latest, to avoid an unexpected
    # migration to Ubuntu 26 while the project is still under development.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting (informational)
        continue-on-error: true
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-web:
    name: Build Web (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: analyze-and-test
    # Only run when secrets are expected to be available:
    # pushes to main/develop and manual dispatches, never pull requests.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 7
          if-no-files-found: error
