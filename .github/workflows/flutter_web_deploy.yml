# ============================================================================
# HESABI — Flutter Web Deploy to GitHub Pages
# ============================================================================

name: Flutter Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # ✅ توليد كود Drift
      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Dart formatting (informational)
        continue-on-error: true
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      # ✅ تصحيح روابط التحميل (تأكد من تطابق الإصدارات)
      - name: Download Drift Web Assets
        run: |
          mkdir -p web
          # تحميل sqlite3.wasm من إصدارات sqlite3.dart
          wget https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.8.0/sqlite3.wasm -O web/sqlite3.wasm
          # تحميل drift_worker.js من إصدارات drift (استخدم نفس إصدار pubspec)
          wget https://github.com/simolus3/drift/releases/download/drift-2.35.2/drift_worker.js -O web/drift_worker.js

      - name: Build Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release \
            --base-href="/$REPO_NAME/" \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
