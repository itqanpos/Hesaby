# ============================================================================
# HESABI — Flutter Web Deploy to GitHub Pages
# ----------------------------------------------------------------------------
# Production deployment of the Flutter Web build to GitHub Pages, using the
# modern Pages deployment model (source = GitHub Actions).
#
# Preconditions (repository setting, not enforced by YAML):
#   * Repository → Settings → Pages → Source = "GitHub Actions"
#   * Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are configured.
#
# Security model:
#   * Only the public anon / publishable key is passed to the client.
#   * A service-role key must never be used here.
#   * Secrets are passed through env vars and never echoed.
# ============================================================================

name: Flutter Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialise deploys without cancelling an in-progress deployment. A deploy
# left half-finished is worse than a slightly stale one, so we let the
# current deployment finish and queue the next.
concurrency:
  group: flutter-web-deploy-${{ github.ref }}
  cancel-in-progress: false

# Required for GitHub Pages deployment via actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release \
            --base-href="/$REPO_NAME/" \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
