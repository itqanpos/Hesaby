# ============================================================================
# HESABI — Flutter Web Deploy to GitHub Pages
# ----------------------------------------------------------------------------
# Production deployment of the Flutter Web build to GitHub Pages, using the
# modern Pages deployment model (source = GitHub Actions).
#
# This project is Flutter/Dart only. It does NOT use Node.js or npm.
# Do not add `actions/setup-node`, `npm ci`, `yarn`, or npm caching here.
# Adding npm caching without a package-lock.json causes the CI to fail with
# "Dependencies lock file is not found".
#
# Preconditions (repository setting, not enforced by YAML):
#   * Repository → Settings → Pages → Source = "GitHub Actions"
#   * Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are configured.
#
# Formatting policy: informational (see flutter_ci.yml for rationale).
# ============================================================================

name: Flutter Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialise deploys without cancelling an in-progress deployment.
concurrency:
  group: flutter-web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web
    # Pinned LTS runner instead of ubuntu-latest, to avoid an unexpected
    # migration to Ubuntu 26 while the project is still under development.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting (informational)
        continue-on-error: true
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release \
            --base-href="/$REPO_NAME/" \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
