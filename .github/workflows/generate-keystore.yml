name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore hesaby-release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias hesaby \
            -storepass 'Hesaby-2026-Keystore!9Pq' \
            -keypass 'Hesaby-2026-Keystore!9Pq' \
            -dname "CN=Hesaby, OU=Mobile, O=ItqanPOS, L=Cairo, ST=Cairo, C=EG"

      - name: Verify keystore
        run: |
          keytool -list -v \
            -keystore hesaby-release-key.jks \
            -storepass 'Hesaby-2026-Keystore!9Pq' | head -20

      - name: Encode to base64 (single line)
        run: |
          base64 -w 0 hesaby-release-key.jks > keystore-base64.txt
          echo "Base64 size: $(wc -c < keystore-base64.txt) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 1
