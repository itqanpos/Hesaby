# pubspec.yaml

name: hesabi
description: "Hesabi - Multi-tenant SaaS for POS, Inventory, Sales and Accounting"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: any
  logger: ^2.4.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  # POS — Phase 7 additions
  # `mobile_scanner` powers the in-app camera barcode scanner.
  # `printing` provides the system print dialog on all supported platforms
  # (Android, iOS, Web, desktop) and pulls in `pdf` for document building.
  # `pdf` is declared explicitly because `printing` does not re-export it.
  mobile_scanner: ^5.2.3
  printing: ^5.13.4
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
