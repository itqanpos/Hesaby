name: hesabi
description: "Hesabi - Multi-tenant SaaS for POS, Inventory, Sales and Accounting"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: any
  logger: ^2.4.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  # Phase T-1 — external links (WhatsApp, phone dialer, web URLs).
  # Used by the subscription page to reach the support channel without
  # leaving the user staring at a phone number they have to retype.
  url_launcher: ^6.3.1

  # POS — Phase 7 additions
  # `mobile_scanner` powers the in-app camera barcode scanner.
  # `printing` provides the system print dialog on all supported platforms
  # (Android, iOS, Web, desktop) and pulls in `pdf` for document building.
  # `pdf` is declared explicitly because `printing` does not re-export it.
  mobile_scanner: ^5.2.3
  printing: ^5.13.4
  pdf: ^3.11.1

  # POS — Phase D additions (thermal printer via Bluetooth / USB / Network)
  #
  # `flutter_pos_printer_platform_image_3` is a maintained fork of the
  # original `flutter_pos_printer_platform` package. It exposes a single
  # `PrinterManager` that supports Bluetooth Classic (SPP), BLE, USB, and
  # network printers. This lets the app work with any thermal printer the
  # user owns, without requiring them to know the exact protocol.
  #
  # `esc_pos_utils_plus` builds ESC/POS tickets, including raster images
  # so Arabic text prints correctly on printers that lack an Arabic code
  # page (which is most low-cost thermal printers sold in the region).
  #
  # `image` is needed to convert the rendered receipt into a bitmap before
  # it is encoded as an ESC/POS raster command.
  flutter_pos_printer_platform_image_3: ^1.2.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # App icon + splash generators.
  #
  # Both tools read their own YAML config at the repository root and write
  # native assets into android/, ios/ and web/. They are only needed when
  # the icons or splash change, so they live as dev_dependencies and are
  # not pulled into production builds.
  #
  # Regenerate with:
  #   flutter pub get
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  # Assets
  #
  # `assets/images/logo.png` is the master 1024×1024 image used by both
  # `flutter_launcher_icons` (launcher icon) and `flutter_native_splash`
  # (native splash screen). It is also kept in the bundle so future
  # in-app usages (login header, receipt header) can reference it with
  # `Image.asset('assets/images/logo.png')`.
  assets:
    - assets/images/
