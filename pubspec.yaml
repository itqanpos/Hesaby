name: hesabi
description: "Hesabi - Multi-tenant SaaS for POS, Inventory, Sales and Accounting"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: any
  logger: ^2.4.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  # Phase T-1 — external links (WhatsApp, phone dialer, web URLs).
  url_launcher: ^6.3.1

  # Media & imaging
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

  # POS — Phase 7 additions
  printing: ^5.13.4
  pdf: ^3.11.1

  # POS — Phase D additions (thermal printer via Bluetooth / USB / Network)
  flutter_pos_printer_platform_image_3: ^1.2.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # App icon + splash generators.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  # Assets
  #
  # `assets/images/logo.png` is the master 1024×1024 image used by both
  # `flutter_launcher_icons` (launcher icon) and `flutter_native_splash`
  # (native splash screen). It is also kept in the bundle so future
  # in-app usages (login header, receipt header) can reference it with
  # `Image.asset('assets/images/logo.png')`.
  assets:
    - assets/images/
