# ============================================================================
# Deploy Supabase Edge Functions
# ============================================================================
# Deploys all functions under supabase/functions/ to the linked project.
#
# Required repository secrets:
#   - SUPABASE_ACCESS_TOKEN : personal access token (account → access tokens)
#   - SUPABASE_PROJECT_REF  : project ref (emvqitmpdkkuyjzegyxf)
# ============================================================================

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "!! SUPABASE_ACCESS_TOKEN secret is empty"
            exit 1
          fi
          if [ -z "$PROJECT_REF" ]; then
            echo "!! SUPABASE_PROJECT_REF secret is empty"
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"

      - name: Deploy admin-create-user
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-create-user

      - name: Deploy admin-update-user
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-update-user

      - name: List deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list || true
