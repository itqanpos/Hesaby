<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hesabi - Multi-tenant SaaS for POS, Inventory, Sales and Accounting">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hesabi">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Hesabi</title>

  <style>
    body {
      background-color: #F5F7F7;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0F1413;
      }
    }
  </style>
</head>
<body>
  <!--
    ZXing is used by the `mobile_scanner` Flutter plugin to decode
    barcodes from a video stream on the web. It is loaded before the
    Flutter bootstrap script so the library is available the first time
    the POS opens the camera scanner.

    The version is pinned to keep builds reproducible; bump it only after
    verifying that `mobile_scanner` still works with the new release.
  -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
